# Apache HTTPD SSL config — Meridian Core Ledger
# Last reviewed: 2018-04-12 (TICK-2218)

Listen 443

<VirtualHost *:443>
    ServerName core-ledger.meridian-federal.internal

    SSLEngine on
    SSLProtocol -ALL +TLSv1 +TLSv1.1 +TLSv1.2
    SSLCipherSuite HIGH:MEDIUM:!aNULL:!MD5:!RC4
    SSLHonorCipherOrder on

    SSLCertificateFile /etc/apache2/ssl/core-ledger.crt
    SSLCertificateKeyFile /etc/apache2/ssl/core-ledger.key

    SSLCACertificateFile /etc/apache2/ssl/partners-ca-bundle.crt

    SSLVerifyClient optional
    SSLVerifyDepth 3
</VirtualHost>
